<header class="editorial-site-header" view-transition-name="header">
    <div class="editorial-site-header__inner">
        <a class="editorial-site-brand" href="{{ nav.homepage.url | url }}">
            <span>{{ config.site_name }}</span>
            <span aria-hidden="true">·</span>
            <span class="editorial-site-brand__edition">Field manual</span>
        </a>

        <div class="editorial-site-tools">
            {% include "templates/search.html" %}
            {% if config.repo_url %}
            <a class="editorial-tool-link" target="_blank" rel="noreferrer" href="{{ config.repo_url }}">Source</a>
            {% endif %}
            <button class="editorial-tool-button editorial-theme-button" type="button" title="Toggle theme"
                onclick="onThemeSwitch(event)">
                <span aria-hidden="true">◐</span>
                <span class="sr-only">Toggle theme</span>
            </button>
            <button id="menu-button" class="editorial-master-trigger" type="button" aria-haspopup="dialog"
                aria-expanded="false" aria-controls="master-navigation" data-state="closed"
                onclick="openMasterNavigation(event)">
                <span>Master index</span>
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor"
                    stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
                    <path d="M2 4h12M2 8h12M2 12h12" />
                </svg>
            </button>
        </div>
    </div>
    <div class="editorial-site-header__rule" aria-hidden="true"></div>
</header>
